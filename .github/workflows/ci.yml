# Shared CI: correctness only.
#
# Nothing here is authoritative for performance. GitHub-hosted runners are
# shared, noisy and of unknown hardware class, so a timing difference measured
# on one describes the runner rather than the change (TRD section 24). The
# smoke benchmark below runs to prove the pipeline works end to end; its
# numbers are discarded.
name: ci

on:
  push:
    branches: [main, develop, workspace]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Format
        run: ruff format --check src tests

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy

      # B-063 — código morto. Confiança 60 e não 80 por MEDIÇÃO: em 80 o portão passa limpo
      # sobre a própria classe de defeito que o motivou (`unused method`, que o vulture pontua
      # em 60). O baseline dos 71 achados pré-existentes tem sunset declarado no cabeçalho dele.
      - name: Dead code
        run: vulture src/ ci/vulture-baseline.py --min-confidence 60

      - name: Unit and integration tests
        run: pytest -q --durations=10

  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"

      - name: Every fixture validates against its schema
        run: |
          for schema in $(theodb-bench schema list); do
            theodb-bench schema validate "$schema" "tests/fixtures/${schema}.json"
          done

  smoke:
    # Proves the pipeline runs, not how fast anything is.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"

      - name: Doctor
        run: theodb-bench doctor --profile smoke

      - name: Smoke benchmark against the fake system
        run: theodb-bench run vector/synthetic/smoke --system fake --output "$RUNNER_TEMP/results"

      - name: The bundle must be complete and self-validating
        run: |
          run_dir=$(find "$RUNNER_TEMP/results" -mindepth 1 -maxdepth 1 -type d | head -1)
          theodb-bench validate "$run_dir"
          test -f "$run_dir/report/report.md"
          test -f "$run_dir/report/summary.json"

      - name: Publish the bundle as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run-bundle
          path: ${{ runner.temp }}/results
          retention-days: 7
