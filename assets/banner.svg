<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="TheoDB Bench — reproducible performance benchmarking for TheoDB" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#141826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#2A2F45" stroke-width="1"/>

  <rect x="72" y="96" width="6" height="108" rx="3" fill="url(#accent)"/>

  <text x="102" y="140" font-size="58" font-weight="800" fill="#FFFFFF">TheoDB <tspan fill="#7DD3FC">Bench</tspan></text>
  <text x="104" y="182" font-size="24" font-weight="500" fill="#AAB2C5">Reproducible performance benchmarking for TheoDB.</text>

  <text x="104" y="228" font-size="16" font-weight="600" letter-spacing="1" fill="#7C8398" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">doctor  ·  run  ·  validate  ·  report  ·  compare</text>

  <text x="104" y="262" font-size="13" font-weight="500" fill="#8B93A7">Immutable run bundles · Versioned schemas · Paired significance · Apache-2.0</text>

  <!-- A Pareto frontier: the shape of an honest approximate-search result.
       Filled points are non-dominated; hollow ones are beaten on both axes. -->
  <g stroke="#3A4159" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="892" y1="76" x2="892" y2="242"/>
    <line x1="892" y1="242" x2="1136" y2="242"/>
  </g>

  <path d="M 906 98 L 948 124 L 998 156 L 1058 192 L 1118 224"
        fill="none" stroke="url(#accent)" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>

  <g fill="#5B6479" fill-opacity="0.9">
    <circle cx="934" cy="176" r="5"/>
    <circle cx="986" cy="210" r="5"/>
    <circle cx="1042" cy="230" r="5"/>
    <circle cx="916" cy="146" r="5"/>
  </g>

  <g fill="url(#accent)">
    <circle cx="906" cy="98" r="7"/>
    <circle cx="948" cy="124" r="7"/>
    <circle cx="998" cy="156" r="7"/>
    <circle cx="1058" cy="192" r="7"/>
    <circle cx="1118" cy="224" r="7"/>
  </g>

  <text x="884" y="70" font-size="11" font-weight="600" letter-spacing="0.8" fill="#6B7488" text-anchor="start" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">recall@k</text>
  <text x="1136" y="262" font-size="11" font-weight="600" letter-spacing="0.8" fill="#6B7488" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">throughput</text>
</svg>
