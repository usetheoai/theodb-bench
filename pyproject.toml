[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theodb-bench"
version = "0.4.0"
description = "Open, reproducible performance benchmarking for TheoDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    # Piso subido de 0.4 para 0.16 depois de uma corrida de CI reprovada por FORMATACAO: a
    # esteira instala o ruff mais novo e a maquina local tinha 0.11, que formata diferente e
    # ainda emite UP038 (depreciada desde entao). Um piso largo num formatador nao da liberdade
    # — da divergencia silenciosa entre quem escreve e quem valida.
    "ruff>=0.16",
    "mypy>=1.8",
    # B-063 — detector de código morto. O arnês não tinha nenhum, e foi assim que um
    # método sem chamador sobreviveu sendo citado como exemplar por outro item.
    "vulture>=2.11",
]
# Kept separate: a plain `doctor` or schema validation must not require a
# database driver or an HDF5 stack to be installed.
postgres = ["psycopg[binary]>=3.1"]
datasets = ["h5py>=3.10"]

[project.scripts]
theodb-bench = "theodb_bench.cli:main"

[tool.setuptools]
# Sources live flat under src/ with no nested package directory; the mapping
# below still installs them as the `theodb_bench` package, so module names stay
# namespaced instead of claiming top-level names like `errors` or `cli`.
package-dir = { "theodb_bench" = "src" }
packages = [
    "theodb_bench",
    "theodb_bench.adapters",
    "theodb_bench.analysis",
    "theodb_bench.bench",
]

[tool.setuptools.package-data]
theodb_bench = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# `theodb_bench` is a symlink to `src` (see [tool.mypy]); linting through it
# would report every finding twice.
# O whitelist do vulture é, por construção, uma lista de nomes indefinidos — F821 em cada
# linha. É entrada de ferramenta, não código do projeto (B-063).
extend-exclude = ["theodb_bench", "ci/vulture-baseline.py"]

[tool.ruff.lint]
# S (flake8-bandit) is on deliberately: adapters spawn external processes and
# the dataset layer downloads files, so subprocess and URL handling are the
# places this project must not be careless.
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests spawn subprocesses and assert on them by design.
"tests/**" = ["S101", "S603", "S607"]
# S608: table and column names cannot be bound as query parameters, so they are
# composed into the SQL -- but only after passing _identifier(), which accepts
# nothing but alphanumerics and underscores and raises otherwise. Every value is
# bound. The check is enforced by test_identifiers_that_are_not_identifiers_are_refused.
"src/adapters/postgres.py" = ["S608"]
# Mesma razão, mesmo precedente: `bench/tpch.py` monta o SQL das queries registradas a partir do
# ESQUEMA, e nome de tabela não pode ser parâmetro de query. Os identificadores passam por
# `_safe_identifier` antes de entrar no texto — a mesma regra do `_identifier` do adapter. A isenção
# vale porque a precondição é ENFORÇADA, não argumentada.
"src/bench/tpch.py" = ["S608"]

[tool.mypy]
python_version = "3.10"
strict = true
# Checked through the symlink rather than through src/, so each module is
# analysed once under the name it is imported by.
files = ["theodb_bench", "tests"]
# Sources are flat in src/ but import as `theodb_bench.*`. A repo-root symlink
# `theodb_bench -> src` gives every tool that resolves imports by path (mypy,
# IDEs, pytest without an install) the same view the installed package has.
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "h5py.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires an external system (database, container) to be running",
    "slow: takes more than a few seconds",
]
